<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Development of Fetal Genitals</title>
  <style>
    :root { --accent: #e0655f; --ink: #2b2b2b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      overflow: hidden;
    }

    .slider { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff; }

    /* Image stage (16:9-ish); fills all space above the dot strip */
    .stage { position: relative; flex: 1 1 auto; min-height: 0; background: #fff; overflow: hidden; cursor: pointer; }
    .slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .35s ease; display: flex; align-items: center; justify-content: center; }
    .slide.active { opacity: 1; visibility: visible; }
    .slide img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* Prev / next arrows */
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(255,255,255,.85); box-shadow: 0 2px 12px rgba(0,0,0,.2);
      color: var(--ink); font-size: 26px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s, opacity .2s;
    }
    .nav-arrow:hover { background: #fff; }
    .nav-arrow:active { transform: translateY(-50%) scale(.93); }
    .nav-arrow[hidden] { display: none; }
    .nav-prev { left: 12px; padding-right: 3px; }
    .nav-next { right: 12px; padding-left: 3px; }

    /* Fullscreen toggle */
    .fs-btn {
      position: absolute; top: 12px; right: 12px; z-index: 3;
      width: 38px; height: 38px; border-radius: 9px; border: none; cursor: pointer;
      background: rgba(255,255,255,.85); box-shadow: 0 2px 8px rgba(0,0,0,.18);
      font-size: 17px; display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .fs-btn:hover { background: #fff; }

    /* Dot strip */
    .dots { flex: 0 0 auto; height: 42px; display: flex; align-items: center; justify-content: center; gap: 11px; background: #fff; }
    .dot { width: 11px; height: 11px; border-radius: 50%; border: none; padding: 0; cursor: pointer; background: #d8d3d0; transition: background .2s, transform .2s; }
    .dot:hover { background: #b9b2ae; }
    .dot.active { background: var(--accent); transform: scale(1.28); }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <div class="slider" role="group" aria-roledescription="carousel" aria-label="Development of fetal genitals timeline">

    <div class="stage" id="stage">
      <figure class="slide active" data-i="0">
        <img src="img/slide-1.jpg" alt="Development of fetal genitals: click across this timeline to view how the genitals develop in the womb for female and male fetuses.">
      </figure>
      <figure class="slide" data-i="1">
        <img src="img/slide-2.jpg" alt="At 6 weeks of gestation, all fetuses have the same &quot;protogenitals,&quot; which resemble neither female nor male genitals. These include the gonads, tubercle, and swelling.">
      </figure>
      <figure class="slide" data-i="2">
        <img src="img/slide-3.jpg" alt="At 12 weeks, the protogenitals have developed about halfway to their fully developed form. In this case, the swelling has largely remained in place, with a hole forming between them. What sex do you think this fetus is?">
      </figure>
      <figure class="slide" data-i="3">
        <img src="img/slide-4.jpg" alt="At 20 weeks, the fetus has developed fully functioning genitals. You can now see this is a female fetus, with a clitoris, labia, and ovaries.">
      </figure>
      <figure class="slide" data-i="4">
        <img src="img/slide-5.jpg" alt="A comparison of female and male genital development: the tubercle becomes either the clitoris or glans penis, the swelling becomes either the labia or scrotum, and the gonads become ovaries or testicles.">
      </figure>

      <button class="nav-arrow nav-prev" id="prev" aria-label="Previous slide" hidden>&#8249;</button>
      <button class="nav-arrow nav-next" id="next" aria-label="Next slide">&#8250;</button>
      <button class="fs-btn" id="fs" aria-label="Toggle full screen" title="Full screen">&#9974;</button>
    </div>

    <div class="dots" id="dots" role="tablist" aria-label="Choose slide"></div>
    <p class="sr-only" aria-live="polite" id="live"></p>
  </div>

  <script>
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
      var total = slides.length;
      var i = 0;

      var stage = document.getElementById('stage');
      var prev = document.getElementById('prev');
      var next = document.getElementById('next');
      var fs = document.getElementById('fs');
      var dotsWrap = document.getElementById('dots');
      var live = document.getElementById('live');

      // Build dots
      var dots = [];
      for (var d = 0; d < total; d++) {
        var b = document.createElement('button');
        b.className = 'dot' + (d === 0 ? ' active' : '');
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-label', 'Slide ' + (d + 1) + ' of ' + total);
        b.dataset.i = d;
        b.addEventListener('click', function (e) { go(parseInt(e.currentTarget.dataset.i, 10)); });
        dotsWrap.appendChild(b);
        dots.push(b);
      }

      function go(n) {
        i = Math.max(0, Math.min(total - 1, n));
        slides.forEach(function (s, idx) { s.classList.toggle('active', idx === i); });
        dots.forEach(function (dt, idx) {
          dt.classList.toggle('active', idx === i);
          dt.setAttribute('aria-selected', idx === i ? 'true' : 'false');
        });
        prev.hidden = (i === 0);
        next.hidden = (i === total - 1);
        live.textContent = 'Slide ' + (i + 1) + ' of ' + total;
      }

      prev.addEventListener('click', function (e) { e.stopPropagation(); go(i - 1); });
      next.addEventListener('click', function (e) { e.stopPropagation(); go(i + 1); });

      // "Click across the timeline": clicking the image advances (until the last slide)
      stage.addEventListener('click', function () { if (i < total - 1) go(i + 1); });

      // Keyboard
      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { go(i + 1); }
        else if (e.key === 'ArrowLeft') { go(i - 1); }
      });

      // Touch swipe
      var x0 = null;
      stage.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      stage.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 40) { go(i + (dx < 0 ? 1 : -1)); }
        x0 = null;
      }, { passive: true });

      // Fullscreen
      fs.addEventListener('click', function (e) {
        e.stopPropagation();
        var el = document.documentElement;
        if (!document.fullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
        }
      });

      go(0);
    })();
  </script>
</body>
</html>
